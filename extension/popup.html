<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>红果短剧下载助手</title><link rel="stylesheet" href="popup.css"></head>
<body><header><span>HONGGUO · VIDEO</span><h1>短剧下载助手</h1><p>打开分享页面，播放后检测视频</p></header>
<main><label>短剧名称<input id="title" placeholder="输入要保存的短剧名称" maxlength="80"></label>
<label>App 分享链接或分享文案<textarea id="share" placeholder="粘贴红果分享链接"></textarea></label><button id="open" class="secondary">打开分享链接</button>
<div class="actions"><button id="start">检测当前页面</button><button id="scan" class="secondary">刷新资源</button><button id="stop" class="secondary">停止</button></div>
<p id="status" role="status" aria-live="polite">尚未开始检测</p><div id="list"></div>
<p class="note">首次检测需授权网页访问。仅检测你指定的一个标签页。请播放所需剧集后刷新资源；插件无法直接访问手机 App，也不自动获取全集。分段流、加密视频暂不支持合并下载。</p><a href="https://developer.chrome.com/docs/extensions/reference/api/downloads" target="_blank" rel="noreferrer">下载由 Chrome 管理</a></main><script src="popup.js" type="module"></script></body></html>
